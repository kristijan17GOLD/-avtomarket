<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Priljubljeni — AvtoMarket</title><style>
:root{--bg:#f6f7f9;--ink:#111318;--muted:#707784;--line:#e6e9ee;--dark:#0f1720}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{max-width:1100px;margin:auto;padding:0 18px}header{background:#fff;border-bottom:1px solid var(--line)}.nav{height:68px;display:flex;align-items:center;gap:12px}.brand{font-size:22px;font-weight:950}.brand span{color:#0f9f83}.sp{flex:1}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:850}.soft{background:#eef1f4}.dark{background:var(--dark);color:#fff}main{padding:32px 0 56px}h1{font-size:34px;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.photo{height:180px;background:#e8ebef center/cover}.body{padding:15px}.title{font-weight:900}.meta{font-size:12px;color:var(--muted);margin:5px 0 11px}.price{font-size:20px;font-weight:950}.remove{margin-top:12px;width:100%;border:0;border-radius:10px;padding:10px;background:#fff0f0;color:#a52727;font-weight:850}.empty{background:#fff;border:1px dashed #ccd2d8;border-radius:17px;padding:30px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html">Avto<span>Market</span></a><div class="sp"></div><a class="btn soft" href="account.html">Moj račun</a><a class="btn dark" href="messages.html">Sporočila</a></div></header><main><div class="wrap"><h1>Priljubljeni oglasi</h1><div id="list" class="empty">Nalagam ...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://esvmfafsqxhcqtuopkap.supabase.co','sb_publishable_04J7SsDJkKSBb_1pi8D1Wg_yL4rrd7Q');let user;
const money=v=>new Intl.NumberFormat('sl-SI').format(Number(v||0))+' €';
async function init(){const r=await db.auth.getUser();user=r.data.user;if(!user){location.href='login.html?next='+encodeURIComponent('favorites.html');return}
const {data,error}=await db.from('favorites').select('listing_id,listings(*)').eq('user_id',user.id).order('created_at',{ascending:false});if(error){list.textContent=error.message;return}if(!data.length){list.className='empty';list.innerHTML='Nimaš še shranjenih oglasov.<br><br><a href="index.html">Poglej vozila →</a>';return}list.className='grid';list.innerHTML=data.map(f=>{const x=f.listings;return `<article class="card"><a href="listing.html?id=${x.id}"><div class="photo" style="background-image:url('${(x.image_urls&&x.image_urls[0])||''}')"></div><div class="body"><div class="title">${x.title}</div><div class="meta">${x.year} · ${new Intl.NumberFormat('sl-SI').format(x.mileage||0)} km</div><div class="price">${money(x.price)}</div></div></a><div class="body" style="padding-top:0"><button class="remove" onclick="removeFav('${x.id}')">Odstrani iz priljubljenih</button></div></article>`}).join('')}
async function removeFav(id){await db.from('favorites').delete().eq('user_id',user.id).eq('listing_id',id);init()}init();
</script></body></html>
