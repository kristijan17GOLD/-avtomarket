<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava — AvtoMarket</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f7f9;color:#111318}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid #e6e9ee;border-radius:22px;padding:26px;box-shadow:0 18px 50px rgba(17,19,24,.08)}.brand{font-size:24px;font-weight:950;margin-bottom:28px}.brand span{color:#0f9f83}h1{margin:0 0 7px;font-size:30px}p{color:#707784;font-size:14px}.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}.field label{font-size:12px;font-weight:850;color:#707784}.field input{padding:13px;border:1px solid #e6e9ee;border-radius:11px}.btn{width:100%;border:0;border-radius:12px;padding:13px;margin-top:18px;background:#0f1720;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#eef1f4;color:#111318}.back{display:block;margin-top:18px;text-align:center;font-size:13px;color:#707784;text-decoration:none}.msg{margin-top:14px;font-size:13px;padding:11px;border-radius:10px;display:none}.msg.ok{display:block;background:#eaf8f4;color:#116754}.msg.err{display:block;background:#fff0f0;color:#9b2929}</style></head><body><div class="wrap"><div class="card"><div class="brand">Avto<span>Market</span></div><h1 id="heading">Prijava</h1><p id="sub">Prijavi se in upravljaj svoje oglase.</p><div class="field"><label>E-pošta</label><input id="email" type="email" placeholder="ime@email.si"></div><div class="field"><label>Geslo</label><input id="password" type="password" placeholder="vsaj 6 znakov"></div><div id="accountTypeField" class="field" style="display:none"><label>Vrsta računa</label><select id="accountType" onchange="toggleCompanyFields()" style="padding:13px;border:1px solid #e6e9ee;border-radius:11px;background:#fff"><option value="private">Fizična oseba</option><option value="dealer">Podjetje / avtohiša</option></select></div>
<div id="nameField" class="field" style="display:none"><label>Ime in priimek</label><input id="fullname" placeholder="Janez Novak"></div>
<div id="companyFields" style="display:none">
<div class="field"><label>Naziv podjetja</label><input id="companyName" placeholder="Primer Avto d.o.o."></div>
<div class="field"><label>Telefon podjetja</label><input id="companyPhone" type="tel" placeholder="+386 40 123 456"></div>
<div class="field"><label>Spletna stran</label><input id="companyWebsite" placeholder="https://..."></div>
</div>
<div id="termsField" class="field" style="display:none"><label style="display:flex;gap:9px;align-items:flex-start;font-weight:600;line-height:1.45"><input id="acceptTerms" type="checkbox" style="width:18px;height:18px;margin-top:2px"> <span>Strinjam se s <a href="terms.html" target="_blank">Pogoji uporabe</a> in sem prebral/a <a href="privacy.html" target="_blank">Politiko zasebnosti</a>.</span></label></div><button class="btn" id="mainBtn" onclick="submitAuth()">Prijava</button><button class="btn secondary" id="switchBtn" onclick="switchMode()">Še nimaš računa? Registracija</button><button class="btn secondary" id="resendBtn" style="display:none" onclick="resendConfirmation()">Ponovno pošlji potrditveni mail</button><div class="msg" id="msg"></div><a class="back" href="index.html">← Nazaj na AvtoMarket</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://esvmfafsqxhcqtuopkap.supabase.co','sb_publishable_04J7SsDJkKSBb_1pi8D1Wg_yL4rrd7Q');let signup=false;const next=new URLSearchParams(location.search).get('next')||'account.html';const AUTH_REDIRECT='https://avtomarket-coral.vercel.app/auth-callback.html';
function show(text,ok=false){const m=document.getElementById('msg');m.textContent=text;m.className='msg '+(ok?'ok':'err')}
function switchMode(){signup=!signup;document.getElementById('heading').textContent=signup?'Registracija':'Prijava';document.getElementById('sub').textContent=signup?'Ustvari račun za objavo in upravljanje vozil.':'Prijavi se in upravljaj svoje oglase.';document.getElementById('accountTypeField').style.display=signup?'flex':'none';document.getElementById('nameField').style.display=signup?'flex':'none';document.getElementById('termsField').style.display=signup?'flex':'none';if(!signup)document.getElementById('companyFields').style.display='none';document.getElementById('mainBtn').textContent=signup?'Ustvari račun':'Prijava';document.getElementById('switchBtn').textContent=signup?'Že imaš račun? Prijava':'Še nimaš računa? Registracija'}
function toggleCompanyFields(){document.getElementById('companyFields').style.display=document.getElementById('accountType').value==='dealer'?'block':'none'}
async function submitAuth(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6){show('Vnesi veljaven e-mail in geslo z vsaj 6 znaki.');return}
if(signup){if(!document.getElementById('acceptTerms').checked){show('Za registracijo se moraš strinjati s pogoji uporabe in politiko zasebnosti.');return}
const account_type=document.getElementById('accountType').value;
const company_name=document.getElementById('companyName').value.trim();
if(account_type==='dealer'&&!company_name){show('Pri poslovnem računu vnesi naziv podjetja.');return}
const full_name=document.getElementById('fullname').value.trim();
const company_phone=document.getElementById('companyPhone').value.trim();
const company_website=document.getElementById('companyWebsite').value.trim();
const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:AUTH_REDIRECT,data:{full_name,account_type,company_name}}});if(error){show(error.message);return}
if(data.user){await db.from('profiles').upsert({id:data.user.id,full_name,phone:company_phone||null,account_type,company_name:company_name||null,company_website:company_website||null})}document.getElementById('resendBtn').style.display='block';show('Račun je ustvarjen. Odpri potrditveni mail in klikni povezavo. Po potrditvi te vrne na AvtoMarket.',true)}
else{const {error}=await db.auth.signInWithPassword({email,password});if(error){show(error.message);return}location.href=next}}
async function resendConfirmation(){const email=document.getElementById('email').value.trim();if(!email){show('Najprej vnesi e-poštni naslov.');return}const {error}=await db.auth.resend({type:'signup',email,options:{emailRedirectTo:AUTH_REDIRECT}});if(error){show(error.message);return}show('Nov potrditveni mail je poslan. Uporabi zadnji prejeti mail.',true)}
</script><script src="i18n.js"></script></body></html>
