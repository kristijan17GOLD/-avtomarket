<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava — AvtoMarket</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f7f9;color:#111318}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid #e6e9ee;border-radius:22px;padding:26px;box-shadow:0 18px 50px rgba(17,19,24,.08)}.brand{font-size:24px;font-weight:950;margin-bottom:28px}.brand span{color:#0f9f83}h1{margin:0 0 7px;font-size:30px}p{color:#707784;font-size:14px}.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}.field label{font-size:12px;font-weight:850;color:#707784}.field input{padding:13px;border:1px solid #e6e9ee;border-radius:11px}.btn{width:100%;border:0;border-radius:12px;padding:13px;margin-top:18px;background:#0f1720;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#eef1f4;color:#111318}.back{display:block;margin-top:18px;text-align:center;font-size:13px;color:#707784;text-decoration:none}.msg{margin-top:14px;font-size:13px;padding:11px;border-radius:10px;display:none}.msg.ok{display:block;background:#eaf8f4;color:#116754}.msg.err{display:block;background:#fff0f0;color:#9b2929}</style></head><body><div class="wrap"><div class="card"><div class="brand">Avto<span>Market</span></div><h1 id="heading">Prijava</h1><p id="sub">Prijavi se in upravljaj svoje oglase.</p><div class="field"><label>E-pošta</label><input id="email" type="email" placeholder="ime@email.si"></div><div class="field"><label>Geslo</label><input id="password" type="password" placeholder="vsaj 6 znakov"></div><div id="nameField" class="field" style="display:none"><label>Ime in priimek</label><input id="fullname" placeholder="Janez Novak"></div><button class="btn" id="mainBtn" onclick="submitAuth()">Prijava</button><button class="btn secondary" id="switchBtn" onclick="switchMode()">Še nimaš računa? Registracija</button><div class="msg" id="msg"></div><a class="back" href="index.html">← Nazaj na AvtoMarket</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://esvmfafsqxhcqtuopkap.supabase.co','sb_publishable_04J7SsDJkKSBb_1pi8D1Wg_yL4rrd7Q');let signup=false;
function show(text,ok=false){const m=document.getElementById('msg');m.textContent=text;m.className='msg '+(ok?'ok':'err')}
function switchMode(){signup=!signup;document.getElementById('heading').textContent=signup?'Registracija':'Prijava';document.getElementById('sub').textContent=signup?'Ustvari račun za objavo in upravljanje vozil.':'Prijavi se in upravljaj svoje oglase.';document.getElementById('nameField').style.display=signup?'flex':'none';document.getElementById('mainBtn').textContent=signup?'Ustvari račun':'Prijava';document.getElementById('switchBtn').textContent=signup?'Že imaš račun? Prijava':'Še nimaš računa? Registracija'}
async function submitAuth(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6){show('Vnesi veljaven e-mail in geslo z vsaj 6 znaki.');return}
if(signup){const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:document.getElementById('fullname').value.trim()}}});if(error){show(error.message);return}if(data.user){await db.from('profiles').upsert({id:data.user.id,full_name:document.getElementById('fullname').value.trim()})}show('Račun je ustvarjen. Če je zahtevano, potrdi e-pošto in se nato prijavi.',true)}
else{const {error}=await db.auth.signInWithPassword({email,password});if(error){show(error.message);return}location.href='sell.html'}}
</script></body></html>
