<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sporočila — AvtoMarket</title><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111318;--muted:#707784;--line:#e6e9ee;--green:#147c68;--dark:#0f1720}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{max-width:1120px;margin:auto;padding:0 18px}header{background:#fff;border-bottom:1px solid var(--line)}.nav{height:68px;display:flex;align-items:center;gap:12px}.brand{font-size:22px;font-weight:950}.brand span{color:#0f9f83}.sp{flex:1}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:850;cursor:pointer}.soft{background:#eef1f4}.dark{background:var(--dark);color:white}
main{padding:28px 0 56px}.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;min-height:650px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.panel h2{font-size:20px;margin:0;padding:18px;border-bottom:1px solid var(--line)}.conv{padding:14px 16px;border-bottom:1px solid #f0f2f4;cursor:pointer}.conv.active{background:#f3f8f6}.conv strong{display:block;font-size:14px}.conv small{display:block;color:var(--muted);margin-top:4px}.chat{display:flex;flex-direction:column}.chatHead{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:900}.messages{flex:1;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:480px}.msg{max-width:72%;padding:10px 12px;border-radius:14px;background:#eef1f4;font-size:14px;line-height:1.45}.msg.me{align-self:flex-end;background:#dff4ee}.msg small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.composer{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}.composer input{flex:1;border:1px solid var(--line);border-radius:11px;padding:12px}.empty{padding:30px;color:var(--muted);text-align:center}
@media(max-width:760px){.layout{grid-template-columns:1fr}.panel:first-child{max-height:260px;overflow:auto}.messages{min-height:360px}.msg{max-width:86%}}</style></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html">Avto<span>Market</span></a><div class="sp"></div><a class="btn soft" href="account.html">Moj račun</a><a class="btn dark" href="sell.html">+ Oglas</a></div></header>
<main><div class="wrap"><div class="layout"><section class="panel"><h2>Pogovori</h2><div id="convs" class="empty">Nalagam ...</div></section><section class="panel chat"><div id="chatHead" class="chatHead">Izberi pogovor</div><div id="messages" class="messages"><div class="empty">Izberi pogovor na levi.</div></div><div class="composer"><input id="body" placeholder="Napiši sporočilo ..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn dark" onclick="sendMessage()">Pošlji</button></div></section></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://esvmfafsqxhcqtuopkap.supabase.co','sb_publishable_04J7SsDJkKSBb_1pi8D1Wg_yL4rrd7Q');
let user=null,currentId=null,channel=null,conversations=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function time(v){return new Date(v).toLocaleString('sl-SI',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
async function init(){const r=await db.auth.getUser();user=r.data.user;if(!user){location.href='login.html?next='+encodeURIComponent('messages.html');return}
const {data,error}=await db.from('conversations').select('id,listing_id,buyer_id,seller_id,updated_at,listings(title,price,image_urls)').order('updated_at',{ascending:false});
if(error){convs.className='empty';convs.textContent=error.message;return}conversations=data||[];renderConvs();const wanted=new URLSearchParams(location.search).get('conversation');if(wanted&&conversations.some(c=>c.id===wanted))openConversation(wanted);else if(conversations[0])openConversation(conversations[0].id)}
function renderConvs(){if(!conversations.length){convs.className='empty';convs.innerHTML='Še nimaš pogovorov.<br><br>Odpri oglas in klikni Kontaktiraj prodajalca.';return}convs.className='';convs.innerHTML=conversations.map(c=>`<div class="conv ${c.id===currentId?'active':''}" onclick="openConversation('${c.id}')"><strong>${esc(c.listings?.title||'Vozilo')}</strong><small>${c.buyer_id===user.id?'Pogovor s prodajalcem':'Pogovor s kupcem'} · ${time(c.updated_at)}</small></div>`).join('')}
async function openConversation(id){currentId=id;renderConvs();const c=conversations.find(x=>x.id===id);chatHead.textContent=(c?.listings?.title||'Pogovor')+' · '+(c?.buyer_id===user.id?'prodajalec':'kupec');await loadMessages();if(channel)await db.removeChannel(channel);channel=db.channel('conversation-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},()=>loadMessages()).subscribe()}
async function loadMessages(){if(!currentId)return;const {data,error}=await db.from('messages').select('*').eq('conversation_id',currentId).order('created_at',{ascending:true});if(error){messages.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}messages.innerHTML=(data||[]).map(m=>`<div class="msg ${m.sender_id===user.id?'me':''}">${esc(m.body)}<small>${time(m.created_at)}</small></div>`).join('')||'<div class="empty">Začni pogovor.</div>';messages.scrollTop=messages.scrollHeight}
async function sendMessage(){const text=body.value.trim();if(!currentId||!text)return;const {error}=await db.from('messages').insert({conversation_id:currentId,sender_id:user.id,body:text});if(error){alert(error.message);return}body.value='';await db.from('conversations').update({updated_at:new Date().toISOString()}).eq('id',currentId);loadMessages()}
init();
</script><script src="i18n.js"></script></body></html>
