<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moj račun — AvtoMarket</title><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111318;--muted:#707784;--line:#e6e9ee;--green:#147c68;--dark:#0f1720}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{max-width:1080px;margin:auto;padding:0 18px}header{background:#fff;border-bottom:1px solid var(--line)}.nav{height:68px;display:flex;align-items:center;gap:14px}.brand{font-size:22px;font-weight:950}.brand span{color:#0f9f83}.sp{flex:1}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:850;cursor:pointer}.dark{background:var(--dark);color:#fff}.soft{background:#edf0f3}.danger{background:#fff0f0;color:#a52727}main{padding:34px 0 60px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.top h1{font-size:36px;margin:0 0 6px;letter-spacing:-1px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.photo{height:180px;background:#e8ebef center/cover no-repeat}.body{padding:16px}.title{font-size:18px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin:5px 0 12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.price{font-size:21px;font-weight:900}.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}.empty{background:#fff;border:1px dashed #cfd5dc;border-radius:18px;padding:32px;text-align:center;color:var(--muted)}.status{display:inline-flex;border-radius:999px;background:#eaf8f4;color:#116754;padding:6px 9px;font-size:11px;font-weight:900}.loading{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:700px){.top{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.nav .soft{display:none}.top h1{font-size:30px}}</style></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html">Avto<span>Market</span></a><div class="sp"></div><a class="btn soft" href="index.html">Vozila</a><a class="btn soft" href="favorites.html">♡ Priljubljeni</a><a class="btn soft" href="messages.html">💬 Sporočila</a><a class="btn dark" href="sell.html">+ Nov oglas</a><button class="btn soft" onclick="logout()">Odjava</button></div></header>
<main><div class="wrap"><div class="top"><div><h1>Moji oglasi</h1><div id="userLine" class="muted">Nalagam račun ...</div></div><a class="btn dark" href="sell.html">Objavi vozilo</a></div><div id="list" class="loading">Nalagam oglase ...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://esvmfafsqxhcqtuopkap.supabase.co','sb_publishable_04J7SsDJkKSBb_1pi8D1Wg_yL4rrd7Q');
function money(v){return new Intl.NumberFormat('sl-SI').format(Number(v||0))+' €'}
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}userLine.textContent=user.user_metadata?.full_name||user.email;const {data,error}=await db.from('listings').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){list.className='empty';list.textContent=error.message;return}if(!data.length){list.className='empty';list.innerHTML='Še nimaš objavljenega vozila.<br><br><a class="btn dark" href="sell.html">Objavi prvi oglas</a>';return}list.className='grid';list.innerHTML=data.map(x=>`<article class="card"><div class="photo" style="background-image:url('${(x.image_urls&&x.image_urls[0])||''}')"></div><div class="body"><div class="row"><div><div class="title">${x.title}</div><div class="meta">${x.year} · ${new Intl.NumberFormat('sl-SI').format(x.mileage||0)} km · ${x.location||'Slovenija'}</div></div><span class="status">${x.status}</span></div><div class="price">${money(x.price)}</div><div class="actions"><a class="btn soft" href="sell.html?edit=${x.id}">Uredi</a><button class="btn danger" onclick="removeListing('${x.id}')">Izbriši</button></div></div></article>`).join('')}
async function removeListing(id){if(!confirm('Res izbrišem ta oglas?'))return;const {error}=await db.from('listings').delete().eq('id',id);if(error){alert(error.message);return}init()}
async function logout(){await db.auth.signOut();location.href='index.html'}init();
</script></body></html>
