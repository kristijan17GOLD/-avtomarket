<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oglas — AvtoMarket</title><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111318;--muted:#707784;--line:#e6e9ee;--green:#147c68;--dark:#0f1720;--soft:#eaf8f4;--shadow:0 18px 50px rgba(17,19,24,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{max-width:1180px;margin:auto;padding:0 18px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav{height:68px;display:flex;align-items:center;gap:14px}.brand{font-size:22px;font-weight:950}.brand span{color:#0f9f83}.sp{flex:1}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:850;cursor:pointer}.dark{background:var(--dark);color:#fff}.soft{background:#eef1f4}
main{padding:26px 0 60px}.crumb{font-size:12px;color:var(--muted);margin-bottom:16px}.layout{display:grid;grid-template-columns:1.45fr .55fr;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:20px}.gallery{overflow:hidden}.heroPhoto{height:450px;background:#e9edf1 center/cover no-repeat;border-radius:20px 20px 0 0}.thumbs{display:flex;gap:8px;padding:12px;overflow:auto}.thumb{width:92px;height:68px;flex:0 0 92px;border-radius:10px;background:center/cover no-repeat;border:2px solid transparent;cursor:pointer}.thumb.active{border-color:var(--green)}
.info{padding:22px}.topline{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.title h1{font-size:34px;letter-spacing:-1.1px;margin:0 0 6px}.subtitle{color:var(--muted);font-size:14px}.price{font-size:34px;font-weight:950;white-space:nowrap}.specGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.spec{background:#f5f7f8;border-radius:12px;padding:13px}.spec small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.spec strong{font-size:14px}.description{line-height:1.65;color:#4d5560}.equipmentBlock{margin-top:22px}.equipmentBlock h3{font-size:22px;margin:0 0 12px}.eqDisplay{display:grid;grid-template-columns:1fr 1fr;gap:12px}.eqCard{border:1px solid var(--line);border-radius:14px;overflow:hidden}.eqCard h4{margin:0;padding:12px 14px;background:#f7f8f9;font-size:14px}.eqCard ul{margin:0;padding:10px 14px 12px 32px}.eqCard li{font-size:13px;line-height:1.55;margin:4px 0}.side{padding:18px}.seller{padding:18px;border-bottom:1px solid var(--line)}.seller h3{margin:0 0 4px}.verified{display:inline-flex;margin-top:8px;background:var(--soft);color:#116754;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.contactBox{padding:18px}.contactBox .btn{width:100%;margin-top:9px}.analysis{margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:16px;background:#fbfcfd}.analysis h3{margin:0 0 8px}.analysisGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px}.metric small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.metric strong{font-size:14px}.aiText{color:#4d5560;line-height:1.55;font-size:14px}.phone{font-size:24px;font-weight:950;margin:12px 0 3px}.muted{color:var(--muted);font-size:13px}.facts{padding:18px;border-top:1px solid var(--line)}.fact{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f0f2f4;font-size:13px}.fact:last-child{border-bottom:0}.fact span:first-child{color:var(--muted)}
.section{margin-top:24px}.section h2{font-size:26px;margin:0 0 14px}.similar{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sim{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.simPhoto{height:145px;background:center/cover no-repeat}.simBody{padding:13px}.simTitle{font-weight:900;font-size:15px}.simMeta{font-size:12px;color:var(--muted);margin:5px 0}.simPrice{font-size:18px;font-weight:950}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.heroPhoto{height:360px}.specGrid{grid-template-columns:repeat(2,1fr)}.similar{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.nav .soft{display:none}.heroPhoto{height:270px}.topline{flex-direction:column}.price{font-size:29px}.title h1{font-size:28px}.similar{grid-template-columns:1fr}.specGrid{grid-template-columns:1fr 1fr}.eqDisplay{grid-template-columns:1fr}.analysisGrid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html">Avto<span>Market</span></a><div class="sp"></div><a class="btn soft" href="account.html">Moj račun</a><a class="btn dark" href="sell.html">+ Objavi vozilo</a></div></header>
<main><div class="wrap"><div class="crumb"><a href="index.html">Vozila</a> / <span id="crumbTitle">Oglas</span></div><div id="app" class="loading">Nalagam oglas ...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://esvmfafsqxhcqtuopkap.supabase.co','sb_publishable_04J7SsDJkKSBb_1pi8D1Wg_yL4rrd7Q');
const id=new URLSearchParams(window.location.search).get('id');let currentListing=null;
const appEl=document.getElementById('app');
const crumbTitleEl=document.getElementById('crumbTitle');
function countryName(c){return ({SI:'Slovenija',HR:'Hrvaška',BA:'Bosna in Hercegovina'})[c]||'Slovenija'}
function vehicleTypeName(t){return ({car:'Osebni avto',motorcycle:'Motor',van:'Kombi',truck:'Tovornjak',atv:'Štirikolesnik / ATV',camper:'Avtodom',trailer:'Prikolica',commercial:'Gospodarsko vozilo'})[t]||'Osebni avto'}
function vinStatus(d){return ({not_checked:'Ni preverjen',pending:'Preverjanje v teku',verified:'Preverjen',warning:'Opozorilo',failed:'Napaka preverjanja'})[d?.vin_check_status||'not_checked']||'Ni preverjen'}
function renderEquipment(eq){if(!eq||typeof eq!=='object'||!Object.keys(eq).length)return '<div class="muted">Prodajalec ni označil dodatne opreme.</div>';return Object.entries(eq).filter(([_,v])=>Array.isArray(v)&&v.length).map(([group,items])=>'<div class="eqCard"><h4>'+esc(group)+'</h4><ul>'+items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></div>').join('')||'<div class="muted">Prodajalec ni označil dodatne opreme.</div>'}
const money=v=>new Intl.NumberFormat('sl-SI').format(Number(v||0))+' €';
const km=v=>new Intl.NumberFormat('sl-SI').format(Number(v||0))+' km';
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){
 if(!id){appEl.className='card';appEl.style.padding='30px';appEl.textContent='Oglas ni bil izbran.';return}
 const {data,error}=await db.from('listings').select('id,user_id,country,vehicle_type,brand,model,title,year,mileage,fuel,transmission,body_type,price,location,vin,description,image_urls,seller_name,status,featured,equipment,vin_check_status,contact_phone,contact_email,show_phone,show_email').eq('id',id).single();
 if(error||!data){appEl.className='card';appEl.style.padding='30px';appEl.textContent='Oglas ne obstaja ali ni več aktiven.';return}
 currentListing=data;document.title=data.title+' — AvtoMarket';crumbTitleEl.textContent=data.title;
 const imgs=(data.image_urls&&data.image_urls.length?data.image_urls:['https://images.unsplash.com/photo-1494976388531-d1058494cdd8?auto=format&fit=crop&w=1400&q=85']);
 appEl.className='';appEl.innerHTML=`
 <div class="layout">
   <section>
    <div class="card gallery"><div id="heroPhoto" class="heroPhoto" style="background-image:url('${imgs[0]}')"></div><div class="thumbs">${imgs.map((u,i)=>`<div loading="lazy" class="thumb ${i===0?'active':''}" style="background-image:url('${u}')" onclick="setPhoto('${u}',this)"></div>`).join('')}</div></div>
    <div class="card info" style="margin-top:16px">
      <div class="topline"><div class="title"><h1>${esc(data.title)}</h1><div class="subtitle">${esc(data.location||'Slovenija')} · objavljeno na AvtoMarket</div></div><div class="price">${money(data.price)}</div></div>
      <div class="specGrid">
       <div class="spec"><small>Letnik</small><strong>${data.year||'-'}</strong></div>
       <div class="spec"><small>Kilometri</small><strong>${km(data.mileage)}</strong></div>
       <div class="spec"><small>Gorivo</small><strong>${esc(data.fuel||'-')}</strong></div>
       <div class="spec"><small>Menjalnik</small><strong>${esc(data.transmission||'-')}</strong></div>
       <div class="spec"><small data-i18n="vehicleType">Vrsta vozila</small><strong>${vehicleTypeName(data.vehicle_type)}</strong></div><div class="spec"><small data-i18n="country">Država / trg</small><strong>${countryName(data.country)}</strong></div><div class="spec"><small>Karoserija / tip</small><strong>${esc(data.body_type||'-')}</strong></div>
       <div class="spec"><small>Znamka</small><strong>${esc(data.brand||'-')}</strong></div>
       <div class="spec"><small>Model</small><strong>${esc(data.model||'-')}</strong></div>
       <div class="spec"><small>VIN</small><strong>${data.vin?esc(data.vin.slice(0,4)+'••••••••'+data.vin.slice(-4)):'Ni naveden'}</strong></div><div class="spec"><small>VIN pregled</small><strong>${vinStatus(data)}</strong></div>
      </div>
      <h3>Opis vozila</h3><div class="description">${esc(data.description||'Prodajalec ni dodal dodatnega opisa.')}</div>
      <div class="equipmentBlock"><h3>Oprema vozila</h3><div class="eqDisplay">${renderEquipment(data.equipment)}</div></div>
    </div>
   </section>
   <aside class="card side">
    <div class="seller"><h3>${esc(data.seller_name||'Zasebni prodajalec')}</h3><div class="muted">${esc(data.location||'')} · ${countryName(data.country)}</div><span class="verified">✓ Preverjen profil</span></div>
    <div class="contactBox"><div class="muted">Cena vozila</div><div class="phone">${money(data.price)}</div><div id="directContacts"></div><button class="btn dark" onclick="startChat()" data-i18n="contactSeller">Pošlji sporočilo</button><button id="favBtn" class="btn soft" onclick="toggleFavorite()" data-i18n="saveAd">Shrani oglas</button><button id="compareBtn" class="btn soft" onclick="toggleCompare()">⇄ Primerjaj</button><button class="btn soft" onclick="navigator.share?navigator.share({title:document.title,url:location.href}):navigator.clipboard.writeText(location.href)" data-i18n="share">Deli oglas</button></div>
    <div class="facts"><div class="fact"><span>Status</span><strong>${esc(data.status)}</strong></div><div class="fact"><span>ID oglasa</span><strong>${esc(String(data.id).slice(0,8))}</strong></div><div class="fact"><span>Izpostavljen</span><strong>${data.featured?'Da':'Ne'}</strong></div></div><div id="marketAnalysis" class="analysis"><h3 data-i18n="marketAnalysis">AI tržna analiza</h3><div class="muted">Računam podobne oglase ...</div></div>
   </aside>
 </div>
 <section class="section"><h2 data-i18n="similar">Podobna vozila</h2><div id="similar" class="similar"></div></section>`;
 syncCompare();renderDirectContacts(data);setTimeout(()=>window.AvtoMarketI18n?.translate(),0);
 const runSecondary=()=>{loadSimilar(data);syncFavorite();loadMarketAnalysis(data)};
 if('requestIdleCallback' in window)requestIdleCallback(runSecondary,{timeout:700});else setTimeout(runSecondary,80);
}
window.setPhoto=(url,el)=>{const hero=document.getElementById('heroPhoto');if(!hero)return;hero.style.backgroundImage=`url('${url}')`;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
async function loadSimilar(cur){const similarEl=document.getElementById('similar');const {data}=await db.from('listings').select('id,title,year,mileage,price,image_urls').eq('status','active').neq('id',cur.id).or(`brand.eq.${cur.brand},body_type.eq.${cur.body_type||''}`).limit(3);similarEl.innerHTML=(data||[]).map(x=>`<a class="sim" href="listing.html?id=${x.id}"><div class="simPhoto" style="background-image:url('${(x.image_urls&&x.image_urls[0])||''}')"></div><div class="simBody"><div class="simTitle">${esc(x.title)}</div><div class="simMeta">${x.year} · ${km(x.mileage)}</div><div class="simPrice">${money(x.price)}</div></div></a>`).join('')||'<div class="muted">Trenutno ni podobnih vozil.</div>'}

function renderDirectContacts(d){
 const el=document.getElementById('directContacts');if(!el)return;
 let html='';
 if(d.show_phone&&d.contact_phone){const tel=String(d.contact_phone).replace(/[^+\d]/g,'');html+='<a class="btn dark" style="display:block;text-align:center" href="tel:'+tel+'">☎ Pokliči '+esc(d.contact_phone)+'</a>'}
 if(d.show_email&&d.contact_email){html+='<a class="btn soft" style="display:block;text-align:center" href="mailto:'+encodeURIComponent(d.contact_email)+'">✉ '+esc(d.contact_email)+'</a>'}
 if(!html)html='<div class="muted" style="margin:8px 0">Prodajalec ni javno prikazal telefona ali e-pošte.</div>';
 el.innerHTML=html;
}
async function startChat(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?next='+encodeURIComponent(location.href);return}if(!currentListing?.user_id){alert('To je testni oglas brez uporabniškega prodajalca. Pri oglasih uporabnikov bo sporočanje delovalo neposredno.');return}if(currentListing.user_id===user.id){location.href='account.html';return}
const {data:existing}=await db.from('conversations').select('id').eq('listing_id',currentListing.id).eq('buyer_id',user.id).eq('seller_id',currentListing.user_id).maybeSingle();
let cid=existing?.id;if(!cid){const {data:newc,error}=await db.from('conversations').insert({listing_id:currentListing.id,buyer_id:user.id,seller_id:currentListing.user_id}).select('id').single();if(error){alert(error.message);return}cid=newc.id}location.href='messages.html?conversation='+cid}
async function syncFavorite(){const btn=document.getElementById('favBtn');if(!btn||!currentListing)return;const {data:{user}}=await db.auth.getUser();if(!user)return;const {data}=await db.from('favorites').select('listing_id').eq('user_id',user.id).eq('listing_id',currentListing.id).maybeSingle();if(data)btn.textContent='♥ Shranjeno'}
function compareIds(){return JSON.parse(localStorage.getItem('compareIds')||'[]')}
function syncCompare(){const b=document.getElementById('compareBtn');if(!b||!currentListing)return;const ids=compareIds();b.textContent=ids.includes(currentListing.id)?'✓ V primerjavi':'⇄ Primerjaj'}
function toggleCompare(){let ids=compareIds();if(ids.includes(currentListing.id)){ids=ids.filter(x=>x!==currentListing.id)}else{if(ids.length>=3){alert('Primerjaš lahko največ 3 vozila.');return}ids.push(currentListing.id)}localStorage.setItem('compareIds',JSON.stringify(ids));syncCompare();if(ids.length>=2&&confirm('Odpreva primerjavo izbranih vozil?'))location.href='compare.html'}
async function loadMarketAnalysis(x){
 const marketEl=document.getElementById('marketAnalysis');if(!marketEl)return;
 const [own,ext]=await Promise.all([
  db.from('listings').select('price,mileage,year').eq('status','active').eq('country',x.country||'SI').eq('vehicle_type',x.vehicle_type||'car').eq('brand',x.brand).eq('model',x.model).gte('year',(x.year||2000)-2).lte('year',(x.year||2000)+2).neq('id',x.id).limit(100),
  db.from('external_market_comps').select('price,mileage,year,source').eq('country',x.country||'SI').eq('vehicle_type',x.vehicle_type||'car').eq('brand',x.brand).eq('model',x.model).gte('year',(x.year||2000)-2).lte('year',(x.year||2000)+2).limit(100)
 ]);
 const rows=[...(own.data||[]),...(ext.data||[])].filter(r=>Number(r.price)>0);
 if(rows.length<2){marketEl.innerHTML='<h3>AI tržna analiza</h3><div class="aiText">Za ta model trenutno še ni dovolj primerljivih oglasov za zanesljivo analizo. Ko bo več podatkov ali priklopljen zunanji vir, bo analiza natančnejša.</div>';return}
 const prices=rows.map(r=>Number(r.price)).sort((a,b)=>a-b);const median=prices[Math.floor(prices.length/2)];
 const avgKm=Math.round(rows.reduce((a,r)=>a+Number(r.mileage||0),0)/rows.length);const pct=((Number(x.price)-median)/median)*100;
 const kmDiff=Number(x.mileage||0)-avgKm;let verdict='Cena je blizu mediane primerljivih vozil.';if(pct<=-7)verdict='Cena je opazno pod mediano primerljivih vozil.';else if(pct>=7)verdict='Cena je opazno nad mediano primerljivih vozil.';
 const extCount=(ext.data||[]).length;marketEl.innerHTML='<h3>AI tržna analiza <span class="muted" style="font-size:11px">(beta)</span></h3><div class="aiText">'+verdict+' Vozilo ima '+(kmDiff>0?Math.abs(kmDiff).toLocaleString('sl-SI')+' km več':Math.abs(kmDiff).toLocaleString('sl-SI')+' km manj')+' od povprečja primerljivih oglasov. Analiza temelji na '+rows.length+' primerjavah'+(extCount?' tudi iz zunanjih virov':' znotraj AvtoMarket podatkov')+'.</div><div class="analysisGrid"><div class="metric"><small>Mediana cene</small><strong>'+money(median)+'</strong></div><div class="metric"><small>Povp. kilometri</small><strong>'+km(avgKm)+'</strong></div><div class="metric"><small>Odstopanje cene</small><strong>'+(pct>0?'+':'')+pct.toFixed(1)+' %</strong></div></div>';
}
async function toggleFavorite(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?next='+encodeURIComponent(location.href);return}const {data}=await db.from('favorites').select('listing_id').eq('user_id',user.id).eq('listing_id',currentListing.id).maybeSingle();if(data){await db.from('favorites').delete().eq('user_id',user.id).eq('listing_id',currentListing.id);favBtn.textContent='♡ Shrani oglas'}else{const {error}=await db.from('favorites').insert({user_id:user.id,listing_id:currentListing.id});if(error){alert(error.message);return}favBtn.textContent='♥ Shranjeno'}}
load().catch(err=>{console.error(err);appEl.className='card';appEl.style.padding='30px';appEl.innerHTML='<strong>Oglasa trenutno ni mogoče naložiti.</strong><div class="muted" style="margin-top:8px">Osveži stran ali poskusi znova čez trenutek.</div>'});
</script><script src="i18n.js"></script></body></html>
