<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zunanji oglasi | AutoMarket</title>
<meta name="description" content="Ročno izbrane povezave do oglasov vozil, razvrščene po znamkah in modelih.">
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#14242d;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}.wrap{max-width:1160px;margin:auto;padding:0 20px}header{background:#fff;border-bottom:1px solid #dce6e4}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:23px;font-weight:900;letter-spacing:-.04em}.logo span{color:#0c9671}.back{font-size:14px;font-weight:750;color:#126f59}.intro{padding:42px 0 25px}.eyebrow{color:#0a8464;font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.045em;line-height:1.08;margin:10px 0}.intro p,.note{color:#596b73;line-height:1.55}.toolbar{display:grid;grid-template-columns:1fr 220px 220px;gap:10px;margin:24px 0}.toolbar input,.toolbar select{width:100%;padding:13px 14px;border:1px solid #cfddda;border-radius:12px;background:#fff;color:#14242d;font:inherit}.count{font-size:13px;color:#596b73;margin-bottom:18px}.group{margin:28px 0}.group h2{font-size:23px;margin:0 0 14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{display:flex;flex-direction:column;min-height:176px;padding:20px;border:1px solid #dce6e4;border-radius:17px;background:#fff;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px #173c3214}.source{font-size:11px;font-weight:900;color:#0a8464;letter-spacing:.04em}.card strong{font-size:19px;line-height:1.3;margin:12px 0 7px}.meta{font-size:13px;color:#667780}.visit{margin-top:auto;padding-top:15px;color:#087b5e;font-size:14px;font-weight:850}.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin:35px 0}.pager button{border:1px solid #cbdad6;border-radius:9px;padding:10px 14px;background:white;cursor:pointer;font:inherit}.pager button:disabled{opacity:.45;cursor:default}.note{font-size:13px;margin:25px 0 50px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}@media(max-width:600px){.cards{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.intro{padding-top:30px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="logo" href="index.html">Avto<span>Market</span></a><a class="back" href="index.html">← Domov</a></div></header>
<main class="wrap"><section class="intro"><span class="eyebrow">Zunanje povezave</span><h1>Oglasi po znamkah</h1><p>Ročno zbrane povezave do izvirnih oglasov. Izberi znamko ali poišči model.</p>
<div class="toolbar"><input id="search" type="search" placeholder="Išči znamko ali model" aria-label="Išči oglase"><select id="brand" aria-label="Znamka"><option value="">Vse znamke</option></select><select id="model" aria-label="Model"><option value="">Vsi modeli</option></select></div><div class="count" id="count" aria-live="polite"></div></section>
<div id="results"></div><nav class="pager" id="pager" aria-label="Strani oglasov"></nav>
<p class="note">Zunanje povezave se ne osvežujejo samodejno. Ceno in razpoložljivost preveri pri ponudniku. Brez preverjene fotografije ne prikazujemo slike drugega vozila.</p></main>
<script>
const perPage=24;let items=[],page=1;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validUrl=s=>{try{const u=new URL(s);return u.protocol==='https:'&&((u.hostname==='www.avto.net'&&u.pathname.toLowerCase()==='/ads/details.asp')||(u.hostname==='www.avtoo.si'&&/^\/vozilo\/[^/]+\/\d+$/.test(u.pathname)))?u.href:''}catch{return ''}};
function models(){const brand=$('brand').value;const options=[...new Set(items.filter(x=>!brand||x.brand===brand).map(x=>x.model))].sort((a,b)=>a.localeCompare(b,'sl'));const chosen=$('model').value;$('model').innerHTML='<option value="">Vsi modeli</option>'+options.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');if(options.includes(chosen))$('model').value=chosen}
function render(){const q=$('search').value.trim().toLocaleLowerCase('sl');const brand=$('brand').value,model=$('model').value;const filtered=items.filter(x=>(!brand||x.brand===brand)&&(!model||x.model===model)&&(!q||(x.brand+' '+x.model+' '+x.title+' '+(x.year||'')).toLocaleLowerCase('sl').includes(q)));const pages=Math.max(1,Math.ceil(filtered.length/perPage));page=Math.min(page,pages);$('count').textContent=filtered.length+' povezav'+(filtered.length?' · stran '+page+' od '+pages:'');const slice=filtered.slice((page-1)*perPage,page*perPage);const brands=[...new Set(slice.map(x=>x.brand))].sort((a,b)=>a.localeCompare(b,'sl'));$('results').innerHTML=brands.map(b=>'<section class="group"><h2>'+esc(b)+'</h2><div class="cards">'+slice.filter(x=>x.brand===b).map(x=>'<a class="card" href="'+esc(validUrl(x.url))+'" target="_blank" rel="noopener noreferrer"><span class="source">'+esc(x.source||'Zunanji vir').toUpperCase()+' · ZUNANJA POVEZAVA</span><strong>'+esc(x.title)+'</strong><span class="meta">'+(x.year?'Letnik '+esc(x.year):'Podrobnosti preveri pri viru')+(x.mileage!=null?' · '+Number(x.mileage).toLocaleString('sl-SI')+' km':'')+(x.price!=null?' · '+Number(x.price).toLocaleString('sl-SI')+' €':'')+'</span><span class="visit">Poglej izvirni oglas ↗</span></a>').join('')+'</div></section>').join('')||'<p>Za izbrane filtre ni povezav.</p>';$('pager').innerHTML=pages>1?'<button id="prev" '+(page===1?'disabled':'')+'>← Prejšnja</button><span>'+page+' / '+pages+'</span><button id="next" '+(page===pages?'disabled':'')+'>Naslednja →</button>':'';if(pages>1){$('prev').onclick=()=>{page--;render();window.scrollTo(0,0)};$('next').onclick=()=>{page++;render();window.scrollTo(0,0)}}}
fetch('external-listings.json').then(r=>{if(!r.ok)throw Error('Podatki niso dosegljivi');return r.json()}).then(data=>{const seen=new Set;items=data.filter(x=>{if(!x.id||!x.brand||!x.model||!x.title||!validUrl(x.url)||seen.has(x.id))return false;seen.add(x.id);return true});const brands=[...new Set(items.map(x=>x.brand))].sort((a,b)=>a.localeCompare(b,'sl'));$('brand').innerHTML='<option value="">Vse znamke</option>'+brands.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');models();render()}).catch(()=>{$('results').textContent='Povezav trenutno ni mogoče naložiti.'});
$('search').addEventListener('input',()=>{page=1;render()});$('brand').addEventListener('change',()=>{page=1;models();render()});$('model').addEventListener('change',()=>{page=1;render()});
</script></body></html>
